  <style>
    @font-face {
      font-family: "Signerica";
      src: url("./Signerica_Fat.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --bg: #fff;
      --blue: #3a5575;
      --section-gap: clamp(26px, 6vh, 78px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background: var(--bg);
    }

    body {
      color: var(--blue);
      font-family: sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    body.transition-zoom-in .interior-layout,
    body.transition-zoom-in .site-footer {
      animation: pageZoomIn 0.62s cubic-bezier(0.16, 1, 0.3, 1) both;
      transform-origin: center;
    }

    @keyframes pageZoomIn {
      0% {
        transform: scale(0.92);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    body.transition-exit-down .interior-layout,
    body.transition-exit-down .site-footer {
      animation: customOverviewOutDown 0.9s cubic-bezier(0.4, 0, 0.2, 1) both;
      transform-origin: center;
    }

    @keyframes customOverviewOutDown {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(160vh) scale(0.8);
        opacity: 0;
      }
    }

    .home-icon {
      position: fixed;
      top: 24px;
      right: 24px;
      width: 60px;
      z-index: 20;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: center;
    }

    .home-icon:hover {
      transform: scale(1.15);
    }

    .interior-layout {
      width: min(100%, 1480px);
      margin: 0 auto;
      padding: calc(clamp(24px, 6vh, 80px) + 9vh) clamp(20px, 4vw, 44px) 48px;
      display: flex;
      flex-direction: column;
      gap: var(--section-gap);
    }

    .interior-title {
      margin: clamp(16px, 4vh, 48px) 0 clamp(20px, 4vh, 52px);
      text-align: center;
      color: var(--blue);
      font-family: "Signerica", "Signerica Fat", cursive;
      font-size: clamp(25px, 3.15vw, 66px);
      font-weight: 400;
      line-height: 0.85;
      text-shadow: 0 4px 4px rgba(0, 0, 0, 0.12);
      pointer-events: none;
      max-width: 100%;
      padding-inline: clamp(8px, 2vw, 20px);
      box-sizing: border-box;
    }

    .interior-subtitle {
      margin: calc(-1 * clamp(8.5px, 1.7vh, 20.4px)) 0 clamp(17px, 3.4vh, 44.2px);
      text-align: center;
      color: var(--blue);
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(10px, 1.2vw, 16px);
      font-weight: 400;
      letter-spacing: 0.05em;
      line-height: 1.2;
    }

    .interior-gallery {
      width: min(100%, 1080px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(26px, 4vw, 68px);
      align-items: start;
      padding-top: clamp(24px, 7vh, 84px);
    }

    .interior-card {
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1vh, 12px);
    }

    .interior-card-link {
      position: relative;
      display: block;
      color: inherit;
      text-decoration: none;
      overflow: hidden;
      border-radius: 2px;
      box-shadow: 0 4px 4px rgba(0, 0, 0, 0.12);
      transition: box-shadow 0.35s ease;
    }

    .interior-card-overlay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -42%);
      width: 86%;
      text-align: center;
      color: var(--blue);
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(12px, 1.35vw, 20px);
      font-weight: 400;
      letter-spacing: clamp(2px, 0.45vw, 6px);
      line-height: 1.35;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
      z-index: 2;
    }

    .interior-card-overlay-arrow {
      font-weight: 100;
    }

    .interior-card img {
      width: 100%;
      aspect-ratio: 3 / 2;
      height: auto;
      display: block;
      object-fit: cover;
      background: transparent;
    }

    .interior-card-link::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(245, 245, 242, 0.86);
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
      z-index: 1;
    }

    .interior-card-link:hover::before,
    .interior-card-link:focus-visible::before {
      opacity: 1;
      transform: scale(1);
    }

    .interior-card-link:hover .interior-card-overlay,
    .interior-card-link:focus-visible .interior-card-overlay {
      opacity: 1;
      transform: translate(-50%, -50%);
    }

    .interior-card-link:hover,
    .interior-card-link:focus-visible {
      box-shadow: none;
    }

    .interior-note {
      margin: 0;
      width: 100%;
      color: var(--blue);
      font-family: "Barlow Condensed", sans-serif;
      font-style: italic;
      font-size: clamp(10px, 0.9vw, 14px);
      font-weight: 300;
      letter-spacing: 0.02em;
      line-height: 1.2;
      text-align: right;
    }


    .site-footer {
      position: static;
      width: 100%;
      padding: clamp(10px, 1.8vh, 18px) 16px max(24px, env(safe-area-inset-bottom));
      box-sizing: border-box;
      text-align: center;
      color: #3a5575;
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(8px, 0.88vw, 10px);
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1.2;
      margin-top: auto;
    }

    .site-footer a {
      color: inherit;
      text-decoration: none;
    }

    .site-footer a:hover,
    .site-footer a:focus-visible {
      text-decoration: underline;
    }

    @media (max-width: 430px) {
      .interior-layout {
        width: 100%;
        padding-inline: clamp(16px, 6vw, 24px);
        gap: clamp(20px, 5vh, 34px);
      }

      .interior-gallery {
        width: 100%;
        grid-template-columns: 1fr;
        gap: clamp(22px, 5vh, 34px);
        padding-top: clamp(8px, 2vh, 18px);
      }

      .home-icon {
        top: 20px;
        right: 20px;
        width: 54px;
      }
    }
  </style>

<body>
  <a href="./index.html?view=overview" aria-label="Terug naar overzicht">

      data-hover-src="./Foto3.png"
      alt="Terug naar overzichtspagina van het portfolio"
      class="home-icon"
      loading="lazy"
      fetchpriority="high"
      decoding="async"
    >
  </a>

  <main class="interior-layout" aria-label="Interior design portfolio">
    <h1 class="interior-title">interior design</h1>
    <p class="interior-subtitle">"Mijn blik op beleving, invulling en sfeer."</p>

          <img src="./Interior0.png" width="1536" height="1024" alt="Interieurvisualisatie van keuken en leefruimte in vakantiewoning door Ann-Sophie Verschuere" loading="eager" fetchpriority="high" decoding="async">
          <span class="interior-card-overlay">ontdek het ontwerp <span class="interior-card-overlay-arrow">→</span></span>
        </a>
        <figcaption class="interior-note">ontwerp keuken en leefruimte</figcaption>
      </figure>
      <figure class="interior-card">
        <a class="interior-card-link" href="./Ann-SophieVerschuere-2.pdf" target="_blank" rel="noopener noreferrer" aria-label="Open PDF van interieurproject 2">
          <img src="./Interior1-optimized.jpg" width="1536" height="1024" alt="Interieurvisualisatie van slaapkamer in vakantiewoning door Ann-Sophie Verschuere" loading="eager" fetchpriority="high" decoding="async">
          <span class="interior-card-overlay">ontdek het ontwerp <span class="interior-card-overlay-arrow">→</span></span>
        </a>
        <figcaption class="interior-note">ontwerp vakantieverblijf</figcaption>
      </figure>
    </section>
  </main>

  <footer class="site-footer">
    &copy; Ann-Sophie Verschuere I
    <a href="mailto:info@annsophieverschuere.be">info@annsophieverschuere.be</a>
  </footer>

  <script>
    const overviewLink = document.querySelector('a[aria-label="Terug naar overzicht"]');
    const homeIcon = document.querySelector(".home-icon");
    if (homeIcon) {
      const defaultSrc = homeIcon.dataset.defaultSrc;
      const hoverSrc = homeIcon.dataset.hoverSrc;
      const showHover = () => { homeIcon.src = hoverSrc; };
      const showDefault = () => { homeIcon.src = defaultSrc; };

      homeIcon.addEventListener("mouseenter", showHover);
      homeIcon.addEventListener("mouseleave", showDefault);
      homeIcon.addEventListener("focus", showHover);
      homeIcon.addEventListener("blur", showDefault);
      homeIcon.addEventListener("mousedown", showHover);
      homeIcon.addEventListener("mouseup", showDefault);
      homeIcon.addEventListener("touchstart", showHover, { passive: true });
      homeIcon.addEventListener("touchend", showDefault);
      homeIcon.addEventListener("touchcancel", showDefault);
    }

    let isLeavingOverview = false;
    if (overviewLink) {
      overviewLink.addEventListener("click", (event) => {
        if (isLeavingOverview) {
          event.preventDefault();
          return;
        }
        if (
          event.metaKey || event.ctrlKey || event.shiftKey || event.altKey ||
          event.button === 1
        ) {
          return;
        }
        event.preventDefault();
        isLeavingOverview = true;
        document.body.classList.add("transition-exit-down");

        const targetUrl = overviewLink.href;
        const animatedTarget = document.querySelector(".interior-layout");
        let navigated = false;
        const goToOverview = () => {
          if (navigated) return;
          navigated = true;
          window.location.href = targetUrl;
        };

        if (animatedTarget) {
          animatedTarget.addEventListener("animationend", goToOverview, { once: true });
        }
        setTimeout(goToOverview, 900);
      });
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get("from") === "overview") {
      document.body.classList.add("transition-zoom-in");
      const cleanedUrl = `${window.location.pathname}${window.location.hash}`;
      window.history.replaceState({}, "", cleanedUrl);
    }
  </script>
